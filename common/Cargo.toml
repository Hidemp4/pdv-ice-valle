diesel = { version = "2.2.12", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"]}
libsqlite3-sys = { version = "*", features = ["bundled"] }
serde = "1.0.219"
tauri = "2.8.3"
tokio = { version = "1.47.1", features = ["macros"] }
